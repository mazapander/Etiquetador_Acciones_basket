services:
  backend:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${LOCAL_MEDIA_DIR:-./data}
        target: /data
      - type: bind
        source: ${LOCAL_MEDIA_DIR:-./data}/videos
        target: ${VIDEO_STORAGE_DIR}
      - type: bind
        source: ${LOCAL_MEDIA_DIR:-./data}/library
        target: ${VIDEO_LIBRARY_DIR}
      - type: bind
        source: ${LOCAL_MEDIA_DIR:-./data}/clip_exports
        target: ${CLIP_EXPORTS_DIR}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    env_file: ${ENV_FILE:-.env}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
